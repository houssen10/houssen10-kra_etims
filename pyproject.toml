[project]
name = "kra_etims"
authors = [
    { name = "houssen10", email = "admin@example.com" }
]
description = "KRA eTIMS VSCU integration for ERPNext using vscu-python-sdk"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    "requests>=2.28.0",
    "vscu-python-sdk @ git+https://github.com/houssen10/vscu-python-sdk.git@main",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"
